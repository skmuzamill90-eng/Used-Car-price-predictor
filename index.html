<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Car Price Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Used Car Price Predictor</h1>

        <form id="carForm">

            <input type="text"
                   id="name"
                   placeholder="Car Name">

            <br><br>

            <input type="number"
                   id="year"
                   placeholder="Year">

            <br><br>

            <select id="fuel">

                <option>Petrol</option>
                <option>Diesel</option>
                <option>CNG</option>

            </select>

            <br><br>

            <select id="transmission">

                <option>Manual</option>
                <option>Automatic</option>

            </select>

            <br><br>

            <select id="owner">

                <option>First Owner</option>
                <option>Second Owner</option>

            </select>

            <br><br>

            <input type="number"
                   id="kms"
                   placeholder="Kilometers Driven">

            <br><br>

            <button type="submit">

                Predict Price

            </button>

        </form>

        <br>

        <h2 id="result">

            Predicted Price: --

        </h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
